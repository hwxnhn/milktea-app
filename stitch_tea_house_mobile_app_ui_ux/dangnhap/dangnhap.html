<style>
        body {

            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

<style>
    body {

      height: 844px;
      margin: 0 auto;

      overflow: hidden;

<body class="bg-background text-on-background flex flex-col">
<!-- Top App Bar (Suppressing global nav based on "Transactional" rule) -->
<header class="flex items-center justify-between px-margin-mobile h-14 w-full absolute top-0 z-50 bg-primary">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:bg-white/20 transition-colors">
<span class="material-symbols-outlined text-white">arrow_back</span>
</button>
<h1 class="font-title-sm text-title-sm text-white font-bold">Milk Tea Express</h1>
<div class="w-10"></div>
</header>
<main class="flex-grow pt-20 px-margin-mobile pb-32 flex flex-col overflow-y-auto">
<!-- Brand Aesthetic Area -->
<div class="mb-10 text-center">
<div class="w-20 h-20 bg-primary/20 rounded-full mx-auto mb-6 flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A minimalist high-quality close up of a steaming cup of milk tea with visible pearls at the bottom, captured in a clean, professional studio setting. The lighting is soft and natural, emphasizing the creamy texture and warm brown tones of the tea. The aesthetic is modern and refreshing, perfectly aligning with a premium minimalist beverage brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDiRLXU5yxzIfmXjHKApNdF145vIcicx4HjYEnIiAefuQIhG6pO1zOeSAMcSBOFZTPq-YWGKlqgyvm8kdgnp4dcV8mKyyCUJ9TIXBam3cW7P1Fbd9IXLfcbylMzr_ltGmBTT-oius25CFCn9QK_jF3AXaA94U7XcWLLlIeQBWRGUS7a13DPeJxf-bBBoac-1rGJEFNeZrPJwasAIRXiUv5DzPGe_-vz3WFu8PtplZyM8w1BhGgBQq9P6w"/>
</div>
<h2 class="font-headline-md text-headline-md text-on-background mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to start your tea journey</p>
</div>
<!-- Login Form Section -->
<div class="space-y-6">
<!-- Large Input Field: Email/Phone -->
<div class="space-y-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="login-id">Email or Phone Number</label>
<div class="relative">
<input autocomplete="username" class="w-full h-14 px-4 bg-surface-container-low border border-outline-variant rounded-xl font-body-lg text-body-lg focus:border-primary transition-all duration-200" id="login-id" placeholder="Enter your contact info" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline">contact_mail</span>
</div>
</div>
<!-- Large Input Field: Password -->
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<button class="font-label-sm text-label-sm text-primary">Forgot?</button>
</div>
<div class="relative">
<input autocomplete="current-password" class="w-full h-14 px-4 bg-surface-container-low border border-outline-variant rounded-xl font-body-lg text-body-lg focus:border-primary transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Biometric Quick Login Section -->
<div class="pt-2 flex flex-col items-center space-y-4">
<button class="flex items-center space-x-2 text-primary font-body-md py-2 px-4 rounded-full hover:bg-primary/10 transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined">fingerprint</span>
<span>Use FaceID or Fingerprint</span>
</button>
<div class="flex items-center w-full space-x-4 opacity-50">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-outline">or continue with</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
<!-- Google Login Option -->
<button class="w-full h-12 flex items-center justify-center border border-outline-variant rounded-xl bg-surface hover:bg-surface-container-low transition-colors active:scale-[0.98]" style="transform: scale(1);">
<svg class="w-5 h-5 mr-3" viewbox="0 0 24 24">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-title-sm text-title-sm font-medium">Google Account</span>
</button><button class="w-full h-12 flex items-center justify-center border border-outline-variant rounded-xl bg-surface hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<svg class="w-5 h-5 mr-3" fill="#1877F2" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
<span class="font-title-sm text-title-sm font-medium">Facebook Account</span>
</button>
</div>
</div>
</main>
<!-- Fixed Bottom CTA (Urgent / Primary) -->
<footer class="absolute bottom-0 left-0 right-0 p-6 bg-surface shadow-[0_-8px_24px_rgba(0,0,0,0.05)]">
<div class="max-w-md mx-auto space-y-4">
<button class="w-full h-14 bg-accent text-white rounded-xl font-title-sm text-title-sm font-bold shadow-lg shadow-accent/20 active:scale-[0.97] transition-transform flex items-center justify-center">
                Sign In
            </button>
<p class="text-center font-body-md text-body-md text-on-surface-variant">
                Don't have an account? <a class="text-accent font-bold hover:underline" href="#">Create Account</a>
</p>
<!-- Safe Area Spacer for iOS -->
<div class="h-2"></div>
</div>
</footer>
<script>
        function togglePassword() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Simple button interaction feedback
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.97)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });

        // Handle auto-fill background color cleanup
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                if(input.value.length > 0) {
                    input.classList.add('bg-white');
                    input.classList.remove('bg-surface-container-low');
                } else {
                    input.classList.add('bg-surface-container-low');
                    input.classList.remove('bg-white');
                }
            });
        });
    </script>
</body></html>
